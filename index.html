<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sukiri | Crochet Shop</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <div class="header">
            <button><img src="assets/sukiri heart.png">SUKIRI</button>
        </div>
        <div class="header">
            <span>HOME</span>
            <span>ABOUT</span>
            <span>PRODUCTS</span>
            <span>FAQ</span>
            <span>CONTACT</span>
        </div>
    </div>
    <div class="yes">
        <div class="mid">
            <div class="middle">
                <h1>YOUR LUCKY LOOP</h1>
                <p>a small handmade crochet shop bringing your favorite characters, bouquets, and keychains to life, one
                    stitch

                </p>
                <button class="order-btn">ORDER NOW</button>
            </div>
            <div class="middle">
                <img src="assets/sukiri logo.png" alt="logo">
            </div>
        </div>
        <div class="footer">
            <button class="chat-btn">CHAT NOW</button>
        </div>
    </div>
    <script src="script.js"></script>

</html>
